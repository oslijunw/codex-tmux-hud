<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Codex TPS</title>
<style>
:root{--bg:#f3f3f1;--panel:#fafbf9;--line:#e4e7e1;--text:#26312b;--muted:#899287;--green:#327b59;--selected:#e7f0e7;--hover:#edf0e9;--chart:#438467;--shadow:0 10px 35px #1c302518;--system:-apple-system,BlinkMacSystemFont,system-ui,"PingFang SC",sans-serif}
*{box-sizing:border-box}html{min-width:300px}body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:12px var(--system);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid #76a98d;outline-offset:2px}.widget{position:relative;width:100%;max-width:440px;margin:0 auto;padding:0 12px 8px;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.native{padding:0;background:var(--panel)}.native .widget{border:0;border-radius:0;box-shadow:none;max-width:440px}.top{height:44px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line)}h1{font-size:14px;font-weight:650;letter-spacing:-.2px;margin:0}.status-dot{width:5px;height:5px;background:#93a18e;border-radius:50%;margin-right:1px}.status-dot.connected{background:#58986d}.status-dot.offline{background:#d79953}.demo{font-size:10px;color:#a37a42;background:#f7ecd9;border:1px solid #e8d9bd;border-radius:4px;padding:1px 5px;display:none}.actions{margin-left:auto;display:flex;gap:3px}.icon-button{width:25px;height:25px;display:grid;place-items:center;border:0;border-radius:6px;background:none;color:var(--muted);padding:0}.icon-button:hover,.icon-button[aria-expanded=true]{background:var(--hover);color:var(--text)}.icon-button.busy svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.table-head,.model-row{display:grid;grid-template-columns:minmax(104px,1fr) repeat(4,53px);align-items:center;gap:0}.table-head{height:28px;font-size:11px;color:var(--muted);padding:0 7px}.table-head span:not(:first-child){text-align:right}.model-list{max-height:180px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#c7cfc2 transparent;padding:0 0 5px}.model-row{width:100%;height:36px;background:none;border:0;border-radius:7px;padding:0 7px;text-align:left;margin:1px 0;font-family:var(--system)}.model-row:hover{background:var(--hover)}.model-row.selected{background:var(--selected)}.model-label{font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;padding-right:5px}.model-row.selected .model-label{color:var(--green)}.value{text-align:right;font-size:12.5px;letter-spacing:0;font-variant-numeric:tabular-nums}.model-row.selected .value{color:var(--green)}.model-row .latest{font-weight:650}.empty-list{font-size:11px;color:var(--muted);height:56px;display:grid;place-items:center}.chart-section{border-top:1px solid var(--line);padding-top:10px}.chart-toolbar{display:flex;align-items:center;justify-content:space-between;gap:6px;height:26px}.chart-name{font:500 11px var(--system);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);padding-left:2px}.ranges{display:flex;gap:2px;background:var(--hover);padding:2px;border-radius:6px;flex:none}.range{border:0;background:none;color:var(--muted);font-size:10px;padding:4px 9px;border-radius:4px}.range.active{background:var(--panel);color:var(--green);box-shadow:0 1px 3px #253b2210}.chart-area{position:relative;height:160px;margin-top:3px}.chart{display:block;width:100%;height:160px}.chart text{font-family:var(--system);font-variant-numeric:tabular-nums}.chart-empty{position:absolute;inset:20px 0 26px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);pointer-events:none}.tooltip{display:none;position:absolute;z-index:2;pointer-events:none;padding:8px 10px;border:1px solid var(--line);background:var(--panel);box-shadow:0 4px 18px #1b30251d;border-radius:7px;min-width:116px}.tip-time{font:10px var(--system);color:var(--muted)}.tip-value{font:600 18px var(--system);color:var(--green);margin:5px 0}.tip-value small{font-size:10px;font-weight:400;color:var(--muted)}.tip-detail{font:10px var(--system);color:var(--muted)}.foot{height:19px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted);padding:0 2px}.foot .offline{color:#bb854a}.menu{position:absolute;z-index:5;top:37px;right:8px;width:186px;border:1px solid var(--line);border-radius:9px;background:var(--panel);box-shadow:0 8px 28px #1d342328;padding:5px;display:none}.menu.open{display:block}.menu-row{width:100%;min-height:29px;padding:6px 8px;display:flex;align-items:center;justify-content:space-between;gap:7px;border:0;border-radius:5px;background:none;text-align:left;font-size:12px}.menu-row:hover{background:var(--hover)}.menu-row:disabled{color:var(--muted);opacity:.6;cursor:default}.menu-source{cursor:default}.menu-source:hover{background:none}.menu-source label{color:var(--muted);font-size:11px}.menu-source select{font-size:11px;width:105px;max-width:105px;border:0;background:transparent;text-align:right;padding:2px;outline:0}.menu-separator{height:1px;background:var(--line);margin:4px 3px}.menu-shortcut{font-size:10px;color:var(--muted)}.native-action{display:none}.diagnostics{position:absolute;z-index:4;top:48px;left:12px;right:12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 28px #1d342328;padding:10px 12px;display:none;max-height:310px;overflow:auto}.diagnostics.open{display:block}.diag-head{display:flex;align-items:center;justify-content:space-between;height:22px;margin-bottom:5px;font-weight:600;font-size:12px}.diag-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.diag-row b{font:12px var(--system);color:var(--text);text-align:right;white-space:nowrap}.diag-error{max-width:225px;overflow:hidden;text-overflow:ellipsis;font-size:10px!important}.toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:none;z-index:9;padding:7px 11px;border-radius:7px;background:var(--text);color:var(--panel);font-size:10px;white-space:nowrap}.toast.visible{display:block}[hidden]{display:none!important}
@media(max-width:390px){body{padding:8px}.widget{padding-left:9px;padding-right:9px}.table-head,.model-row{grid-template-columns:minmax(85px,1fr) repeat(4,46px)}.model-label{font-size:12px}.value{font-size:12px}.range{padding-left:7px;padding-right:7px}.diagnostics{left:9px;right:9px}.native{padding:0}}
@media(prefers-color-scheme:dark){:root{--bg:#242725;--panel:#282c29;--line:#3b423c;--text:#dbe3da;--muted:#8e9d8d;--green:#8cc29b;--selected:#344b3c;--hover:#343b34;--chart:#88be9b;--shadow:0 10px 35px #0004}.demo{color:#d3b37f;background:#463d2e;border-color:#64533a}.model-list{scrollbar-color:#4f5e4e transparent}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="widget app" id="widget">
<header class="top"><i class="status-dot" id="statusDot" title="连接中"></i><h1>Codex TPS</h1><span class="demo" id="demoBadge">演示</span><div class="actions"><button class="icon-button" id="refreshButton" title="刷新" aria-label="刷新"><svg width="13" height="13" viewBox="0 0 20 20" fill="none"><path d="M16 7a6.5 6.5 0 1 0 .3 5M16 3v4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="icon-button" id="menuButton" title="选项" aria-label="选项" aria-expanded="false" aria-controls="menu"><svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><circle cx="4" cy="10" r="1.4"/><circle cx="10" cy="10" r="1.4"/><circle cx="16" cy="10" r="1.4"/></svg></button></div></header>
<div class="table-head" aria-hidden="true"><span>模型</span><span>最新</span><span>1h</span><span>24h</span><span>全部</span></div>
<div class="model-list" id="modelList" role="group" aria-label="按模型统计 TPS"><div class="empty-list">连接中…</div></div>
<section class="chart-section" aria-label="TPS 时序曲线"><div class="chart-toolbar"><span class="chart-name" id="chartName">—</span><div class="ranges" role="group" aria-label="时间范围"><button class="range active" data-window="1h" aria-pressed="true">1h</button><button class="range" data-window="24h" aria-pressed="false">24h</button><button class="range" data-window="all" aria-pressed="false">全部</button></div></div><div class="chart-area" id="chartArea"><svg class="chart" id="chart" role="img" aria-label="TPS 曲线"></svg><div class="chart-empty" id="chartEmpty">暂无数据</div><div class="tooltip" id="tooltip"><div class="tip-time" id="tipTime"></div><div class="tip-value"><span id="tipTps"></span> <small>t/s</small></div><div class="tip-detail" id="tipDetail"></div></div></div></section>
<footer class="foot"><span id="updateState">—</span><span id="sampleCount">0 次 · t/s</span></footer>
<div class="menu" id="menu" role="group" aria-label="选项"><div class="menu-row menu-source"><label for="sourceSelect">来源</label><select id="sourceSelect"><option value="all">全部</option><option value="cli">CLI</option><option value="desktop">桌面端</option><option value="unknown">未识别</option></select></div><div class="menu-separator"></div><button class="menu-row" id="exportButton" disabled><span>导出 CSV</span><span class="menu-shortcut">↗</span></button><button class="menu-row native-action" id="browserButton"><span>在浏览器打开</span><span class="menu-shortcut">↗</span></button><button class="menu-row" id="diagnosticsButton"><span>诊断</span><span class="menu-shortcut">›</span></button><button class="menu-row native-action" id="quitButton"><span>退出</span></button></div>
<div class="diagnostics" id="diagnostics" role="dialog" aria-modal="false" aria-label="诊断"><div class="diag-head"><span>诊断</span><button class="icon-button" id="closeDiagnostics" aria-label="关闭诊断">×</button></div><div id="diagnosticRows"></div></div>
<div class="toast" id="toast" role="status"></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const queryParams=new URLSearchParams(location.search);
const NATIVE=queryParams.get('native')==='1';
const svgNS='http://www.w3.org/2000/svg';
const state={model:'',source:'all',basis:'response',window:'1h',models:[],points:[],health:{},now:Date.now()/1000,totalCount:0,downsampled:false,busy:false,queued:false,revision:0,lastSuccess:0,error:'',geometry:null};
const stored=key=>{try{return localStorage.getItem((DEMO?'demo.':'')+'codex-tps.'+key);}catch(_){return null;}};
const remember=(key,v)=>{try{localStorage.setItem((DEMO?'demo.':'')+'codex-tps.'+key,v);}catch(_){}};
const num=(v,d=1)=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v))?Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const int=v=>num(v,0);
const text=(tag,cls,value)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=value;return e;};
const svg=(tag,attrs={},value)=>{const e=document.createElementNS(svgNS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));if(value!==undefined)e.textContent=value;return e;};
const time=ts=>new Date(Number(ts)*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const shortTime=ts=>new Date(Number(ts)*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
const dateTime=ts=>new Date(Number(ts)*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const dayTime=ts=>new Date(Number(ts)*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const sourceName=s=>({all:'全部',cli:'CLI',desktop:'桌面端',unknown:'未识别'}[s]||s||'未识别');
function bridge(message){try{const handler=window.webkit?.messageHandlers?.codexTPS;if(handler){handler.postMessage(message);return true;}}catch(_){}return false;}
function hashModel(){try{return new URLSearchParams(location.hash.replace(/^#/,'')).get('model')||'';}catch(_){return '';}}
state.model=hashModel()||queryParams.get('model')||stored('model')||'';
state.source=['all','cli','desktop','unknown'].includes(stored('source'))?stored('source'):'all';
state.window=['1h','24h','all'].includes(stored('window'))?stored('window'):'1h';
if(NATIVE)document.body.classList.add('native');
if(NATIVE&&!DEMO)document.querySelectorAll('.native-action').forEach(el=>el.style.display='flex');
$('demoBadge').style.display=DEMO?'inline':'none';$('sourceSelect').value=state.source;
let lastHeight=0;
function sizeNative(){if(!NATIVE)return;const height=Math.ceil($('widget').getBoundingClientRect().height);if(height!==lastHeight){lastHeight=height;bridge({action:'resize',height});}}
function closeMenu(){$('menu').classList.remove('open');$('menuButton').setAttribute('aria-expanded','false');}
function toast(message){$('toast').textContent=message;$('toast').classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('visible'),2000);}
function selectModel(model,notify=true){if(!model)return;if(state.model===model){if(notify&&!DEMO)bridge({action:'selectModel',model});return;}state.model=model;remember('model',model);history.replaceState(null,'','#model='+encodeURIComponent(model));if(notify&&!DEMO)bridge({action:'selectModel',model});state.points=[];state.totalCount=0;state.revision++;renderModels();renderChart();load();}
function renderModels(){
 const list=$('modelList'),fragment=document.createDocumentFragment();
 for(const m of state.models){const row=text('button','model-row'+(m.model===state.model?' selected':''),'');row.type='button';row.dataset.model=m.model;row.setAttribute('aria-pressed',String(m.model===state.model));row.title=m.model;row.append(text('span','model-label',m.model));
  const latest=text('span','value latest',num(m.latest?.tps));latest.title=m.latest?dateTime(m.latest.ended_at)+' · '+sourceName(m.latest.source):'—';row.append(latest);
  for(const key of ['hour','day','all']){const value=text('span','value',num(m[key]?.avg));value.title=int(m[key]?.count||0)+' 次';row.append(value);}row.addEventListener('click',()=>selectModel(m.model));fragment.append(row);
 }
 if(!state.models.length)fragment.append(text('div','empty-list',state.error?'未连接':'暂无数据'));
 const focused=document.activeElement?.dataset?.model;list.replaceChildren(fragment);if(focused){const active=Array.from(list.children).find(el=>el.dataset.model===focused);active?.focus({preventScroll:true});}
 $('chartName').textContent=state.model||'—';$('chartName').title=state.model;sizeNative();
}
function renderStatus(){
 $('statusDot').className='status-dot'+(state.error?' offline':state.lastSuccess?' connected':'');$('statusDot').title=state.error?'未连接':DEMO?'演示':state.lastSuccess?'已连接':'连接中';
 $('refreshButton').classList.toggle('busy',state.busy);
 $('updateState').className=state.error?'offline':'';
 $('updateState').textContent=state.error?'未连接'+(state.lastSuccess?' · '+time(state.lastSuccess):''):state.lastSuccess?time(state.lastSuccess):'连接中…';
 $('updateState').title=state.error?state.error:state.lastSuccess?dateTime(state.lastSuccess):'';
 $('sampleCount').textContent=int(state.totalCount)+' 次'+(state.downsampled?' · 抽样':'')+' · t/s';
 $('exportButton').disabled=!state.model||!state.points.length;
}
function renderDiagnostics(){
 const h=state.health,up=Number(h.uptime_s)||0;
 const rows=[['有效样本',int(h.accepted_samples||0)],['未计入',int(h.rejected_samples||0)],['待配对',int(h.unmatched_events||0)],['日志',int(h.received_logs||0)],['追踪',int(h.received_spans||0)],['运行',up>=3600?(up/3600).toFixed(1)+' h':Math.floor(up/60)+' min'],['最近事件',h.last_event_at?time(h.last_event_at):'—']];
 if(h.version)rows.push(['版本',String(h.version)]);if(h.last_error)rows.push(['错误',String(h.last_error)]);
 const fragment=document.createDocumentFragment();for(const [name,value]of rows){const row=text('div','diag-row','');row.append(text('span','',name));const val=text('b',name==='错误'?'diag-error':'',value);val.title=value;row.append(val);fragment.append(row);}$('diagnosticRows').replaceChildren(fragment);
}
function showDiagnostics() {closeMenu();renderDiagnostics();$('diagnostics').classList.add('open');$('closeDiagnostics').focus();}
function hideDiagnostics(){$('diagnostics').classList.remove('open');}
function windowButtons(){document.querySelectorAll('[data-window]').forEach(b=>{const active=b.dataset.window===state.window;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});}
function renderChart(){
 const chart=$('chart'),area=$('chartArea'),w=Math.max(260,area.clientWidth),h=160,p={l:32,r:12,t:13,b:25},cw=w-p.l-p.r,ch=h-p.t-p.b,pts=state.points;
 chart.setAttribute('viewBox',`0 0 ${w} ${h}`);chart.replaceChildren();
 const avgSummary=state.models.find(m=>m.model===state.model)?.[({'1h':'hour','24h':'day',all:'all'})[state.window]]?.avg;
 const avg=avgSummary!==null&&avgSummary!==undefined&&Number.isFinite(Number(avgSummary))?Number(avgSummary):pts.length?pts.reduce((s,v)=>s+Number(v.tps),0)/pts.length:0;
 const rawMax=pts.reduce((max,v)=>Math.max(max,Number(v.tps)),avg||0);const max=Math.max(10,Math.ceil(rawMax*1.14/10)*10);
 const now=Number(state.now)||Date.now()/1000;let minT=state.window==='1h'?now-3600:state.window==='24h'?now-86400:pts.length?Number(pts[0].ended_at):now-3600;let maxT=state.window==='all'&&pts.length?Math.max(Number(pts[pts.length-1].ended_at),minT+60):now;if(state.window==='all'&&pts.length){const span=maxT-minT;minT-=span*.015;maxT+=span*.015;}
 const x=t=>p.l+(Number(t)-minT)/(maxT-minT)*cw,y=v=>p.t+ch-Number(v)/max*ch;
 const defs=svg('defs'),gradient=svg('linearGradient',{id:'areaFill',x1:'0',y1:'0',x2:'0',y2:'1'});gradient.append(svg('stop',{offset:'0%','stop-color':'#75a687','stop-opacity':'.16'}),svg('stop',{offset:'100%','stop-color':'#75a687','stop-opacity':'.01'}));defs.append(gradient);const clip=svg('clipPath',{id:'plotClip'});clip.append(svg('rect',{x:p.l,y:p.t,width:cw,height:ch+1}));defs.append(clip);chart.append(defs);
 for(let i=0;i<=3;i++){const value=max*i/3,yy=y(value);chart.append(svg('line',{x1:p.l,y1:yy,x2:p.l+cw,y2:yy,stroke:'var(--line)','stroke-width':.7,'stroke-dasharray':i?'2 4':'0'}),svg('text',{x:p.l-7,y:yy+3,fill:'var(--muted)','font-size':9.5,'text-anchor':'end','font-family':'-apple-system,BlinkMacSystemFont,system-ui,"PingFang SC",sans-serif'},int(value)));}
 for(let i=0;i<3;i++){const t=minT+(maxT-minT)*i/2;chart.append(svg('text',{x:x(t),y:h-7,fill:'var(--muted)','font-size':9.5,'text-anchor':i===0?'start':i===2?'end':'middle','font-family':'-apple-system,BlinkMacSystemFont,system-ui,"PingFang SC",sans-serif'},state.window==='all'?dayTime(t):shortTime(t)));}
 const plot=svg('g',{'clip-path':'url(#plotClip)'});chart.append(plot);
 if(pts.length){const line=pts.map((v,i)=>(i?'L':'M')+x(v.ended_at).toFixed(2)+' '+y(v.tps).toFixed(2)).join(' ');if(pts.length>1){plot.append(svg('path',{d:line+` L${x(pts[pts.length-1].ended_at)} ${y(0)} L${x(pts[0].ended_at)} ${y(0)} Z`,fill:'url(#areaFill)'}),svg('path',{d:line,fill:'none',stroke:'var(--chart)','stroke-width':1.4,'stroke-linejoin':'round','stroke-linecap':'round'}));}
  plot.append(svg('line',{x1:p.l,y1:y(avg),x2:p.l+cw,y2:y(avg),stroke:'#b1a081','stroke-width':.8,'stroke-dasharray':'3 4'}));
  if(pts.length<200)for(const v of pts)plot.append(svg('circle',{cx:x(v.ended_at),cy:y(v.tps),r:pts.length>70?1.4:2,fill:'var(--panel)',stroke:'var(--chart)','stroke-width':1}));
  chart.append(svg('text',{x:p.l+cw,y:Math.max(p.t+7,y(avg)-4),fill:'#aa9776','font-size':9.5,'text-anchor':'end','font-family':'-apple-system,BlinkMacSystemFont,system-ui,"PingFang SC",sans-serif'},'AVG '+num(avg)));
  chart.append(svg('line',{id:'crosshair',x1:0,x2:0,y1:p.t,y2:p.t+ch,stroke:'var(--muted)','stroke-dasharray':'2 3',visibility:'hidden'}),svg('circle',{id:'hoverPoint',r:3.5,fill:'var(--chart)',stroke:'var(--panel)','stroke-width':1.5,visibility:'hidden'}));
  state.geometry={x,y,w,h,p,cw,ch};
 }else state.geometry=null;
 $('chartEmpty').style.display=pts.length?'none':'flex';$('chartEmpty').textContent=state.error?'未连接':'暂无数据';$('tooltip').style.display='none';$('chartName').textContent=state.model||'—';chart.setAttribute('aria-label',(state.model||'模型')+' '+state.window+' TPS，'+pts.length+' 次');renderStatus();sizeNative();
}
function hideTooltip(){$('tooltip').style.display='none';$('crosshair')?.setAttribute('visibility','hidden');$('hoverPoint')?.setAttribute('visibility','hidden');}
function hoverChart(event){const g=state.geometry;if(!g||!state.points.length)return;const rect=$('chart').getBoundingClientRect(),px=(event.clientX-rect.left)/rect.width*g.w;if(px<g.p.l||px>g.p.l+g.cw){hideTooltip();return;}let nearest=state.points[0],distance=Infinity;for(const point of state.points){const d=Math.abs(g.x(point.ended_at)-px);if(d<distance){distance=d;nearest=point;}}const cx=g.x(nearest.ended_at),cy=g.y(nearest.tps),cross=$('crosshair'),dot=$('hoverPoint');cross.setAttribute('x1',cx);cross.setAttribute('x2',cx);cross.setAttribute('visibility','visible');dot.setAttribute('cx',cx);dot.setAttribute('cy',cy);dot.setAttribute('visibility','visible');$('tipTime').textContent=dateTime(nearest.ended_at);$('tipTps').textContent=num(nearest.tps);$('tipDetail').textContent=int(nearest.output_tokens)+' tokens · '+num(nearest.duration_s)+' s';const tip=$('tooltip');tip.style.display='block';tip.style.left=Math.max(0,Math.min(g.w-tip.offsetWidth,cx+10))+'px';tip.style.top=Math.max(0,Math.min(g.h-tip.offsetHeight,cy-tip.offsetHeight/2))+'px';}
async function getJSON(path){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),4500);try{const response=await fetch(path,{cache:'no-store',signal:ctrl.signal});if(!response.ok)throw new Error('HTTP '+response.status);return await response.json();}finally{clearTimeout(timer);}}
async function load(){if(state.busy){state.queued=true;return;}state.busy=true;renderStatus();const revision=state.revision;try{const summary=DEMO?demoSummary():await getJSON('/api/summary?'+new URLSearchParams({source:state.source,basis:'response'}));if(revision!==state.revision)return;state.models=(Array.isArray(summary.models)?summary.models:[]).filter(m=>m&&typeof m.model==='string');state.health=summary.health||{};state.now=Number(summary.now)||Date.now()/1000;if(state.models.length&&!state.models.some(m=>m.model===state.model)){const newest=state.models.reduce((best,m)=>Number(m.latest?.ended_at||0)>Number(best.latest?.ended_at||0)?m:best,state.models[0]);state.model=newest.model;state.points=[];state.totalCount=0;remember('model',state.model);if(NATIVE&&!DEMO)bridge({action:'selectModel',model:state.model});}renderModels();renderDiagnostics();if(state.model){const series=DEMO?demoSeries():await getJSON('/api/series?'+new URLSearchParams({model:state.model,window:state.window,source:state.source,basis:'response'}));if(revision!==state.revision)return;state.points=(Array.isArray(series.points)?series.points:[]).filter(p=>p&&Number.isFinite(Number(p.ended_at))&&Number(p.ended_at)>0&&Number.isFinite(Number(p.tps))&&Number(p.tps)>=0).sort((a,b)=>Number(a.ended_at)-Number(b.ended_at));state.totalCount=Number(series.total_count)||state.points.length;state.downsampled=!!series.downsampled;}else{state.points=[];state.totalCount=0;}state.error='';state.lastSuccess=Date.now()/1000;renderChart();}catch(e){if(revision===state.revision){state.error=e.message||'连接失败';renderModels();renderChart();}}finally{state.busy=false;renderStatus();if(state.queued){state.queued=false;load();}}}
async function exportCSV(){closeMenu();if(!state.model)return;if(NATIVE&&!DEMO&&bridge({action:'export',model:state.model,window:state.window,source:state.source}))return;try{let blob;if(DEMO){const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['model','completed_at','tps','output_tokens','duration_s','source','basis'],...state.points.map(p=>[state.model,new Date(p.ended_at*1000).toISOString(),p.tps,p.output_tokens,p.duration_s,p.source,'response'])];blob=new Blob(['\uFEFF'+rows.map(r=>r.map(esc).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});}else{const response=await fetch('/api/export?'+new URLSearchParams({model:state.model,window:state.window,source:state.source,basis:'response'}),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);blob=await response.blob();}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='codex-tps-'+state.model.replace(/[^a-z0-9_.-]/gi,'_')+'-'+state.window+(DEMO?'-DEMO':'')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){toast('导出失败');}}
$('menuButton').addEventListener('click',()=>{const open=!$('menu').classList.contains('open');$('menu').classList.toggle('open',open);$('menuButton').setAttribute('aria-expanded',String(open));hideDiagnostics();});
document.addEventListener('click',e=>{if(!$('menu').contains(e.target)&&!$('menuButton').contains(e.target))closeMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();hideDiagnostics();}});
$('refreshButton').addEventListener('click',()=>load());$('exportButton').addEventListener('click',exportCSV);$('diagnosticsButton').addEventListener('click',showDiagnostics);$('closeDiagnostics').addEventListener('click',hideDiagnostics);
$('browserButton').addEventListener('click',()=>{closeMenu();bridge({action:'openBrowser'});});$('quitButton').addEventListener('click',()=>bridge({action:'quit'}));
$('sourceSelect').addEventListener('change',e=>{state.source=e.target.value;remember('source',state.source);state.points=[];state.totalCount=0;state.models=[];state.revision++;renderModels();renderChart();load();});
document.querySelectorAll('[data-window]').forEach(b=>b.addEventListener('click',()=>{if(state.window===b.dataset.window)return;state.window=b.dataset.window;remember('window',state.window);state.points=[];state.totalCount=0;state.revision++;windowButtons();renderChart();load();}));
$('modelList').addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp'].includes(e.key))return;const rows=Array.from($('modelList').querySelectorAll('.model-row')),index=rows.indexOf(document.activeElement);if(index<0)return;e.preventDefault();rows[Math.max(0,Math.min(rows.length-1,index+(e.key==='ArrowDown'?1:-1)))]?.focus();});
$('chart').addEventListener('pointermove',hoverChart);$('chart').addEventListener('pointerleave',hideTooltip);
function readHash(){const model=hashModel();if(model&&model!==state.model)selectModel(model,false);if(location.hash==='#diagnostics')showDiagnostics();}window.addEventListener('hashchange',readHash);
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(renderChart,50);});if(typeof ResizeObserver!=='undefined'){new ResizeObserver(()=>sizeNative()).observe($('widget'));new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(renderChart,30);}).observe($('chartArea'));}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
const demoNow=Math.floor(Date.now()/60000)*60;
const demoModels=[['gpt-6.1-sol',58,12],['gpt-6-astra',35,8],['gpt-6.1-terra',82,16]];
function demoPoints(model){const mi=demoModels.findIndex(m=>m[0]===model);if(mi<0)return[];const base=demoModels[mi][1],amp=demoModels[mi][2],points=[];for(let i=0;i<188;i++){const recent=i>=145,ended=recent?demoNow-3500+(i-145)*79:demoNow-129600+i*870,source=i%3?'cli':'desktop';const tps=Math.max(4,base+Math.sin(i*1.73+mi)*amp+Math.cos(i*.34)*amp*.5+(recent?5:0)),duration=8+(i*19)%80;points.push({ended_at:ended,tps:Math.round(tps*10)/10,output_tokens:Math.round(tps*duration),duration_s:duration,source,basis:'response',session_id:'demo-'+i%9});}return points.filter(p=>state.source==='all'||p.source===state.source).sort((a,b)=>a.ended_at-b.ended_at);}
function demoSummary(){return{models:demoModels.map(m=>{const ps=demoPoints(m[0]),agg=p=>({count:p.length,avg:p.length?p.reduce((s,v)=>s+v.tps,0)/p.length:null});return{model:m[0],latest:ps[ps.length-1]||null,hour:agg(ps.filter(p=>p.ended_at>=demoNow-3600)),day:agg(ps.filter(p=>p.ended_at>=demoNow-86400)),all:agg(ps)};}),health:{last_event_at:demoNow-52,accepted_samples:564,rejected_samples:3,unmatched_events:0,received_logs:1052,received_spans:564,uptime_s:139240,version:'1.1.1-demo'},now:demoNow};}
function demoSeries(){let points=demoPoints(state.model);if(state.window!=='all')points=points.filter(p=>p.ended_at>=demoNow-(state.window==='1h'?3600:86400));return{points,total_count:points.length,downsampled:false};}
windowButtons();renderChart();readHash();load();setInterval(()=>{if(!document.hidden)load();},3000);
</script>
